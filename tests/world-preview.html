<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>猫猫小屋 · 3D探索</title><style>*{box-sizing:border-box}body{margin:0}button{font-family:inherit}button b{font:inherit}</style></head><body><section id="world"></section><script type="module">
import '/src/world-experience.css';
