<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#edb582"/><meta name="referrer" content="no-referrer"/><meta name="description" content="和喜欢的人一起养猫，也让温柔公正的猫猫判官陪你们把话说开。支持双人陈词、截图举证与持续复审。"/><title>猫猫小窝 · 一起养猫，好好相处</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<style>
  html,body{margin:0;background:#edcfb1}
  #app-startup{box-sizing:border-box;min-height:100svh;width:100%;display:grid;place-content:center;text-align:center;padding:32px;color:#784d35;font:16px/1.8 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  #app-startup h1{font-size:24px;margin:0 0 12px}#app-startup p{max-width:28em;margin:0 auto 20px}#app-startup button{justify-self:center;color:inherit;background:#fff4e4;border:1px solid #b78b64;border-radius:12px;padding:10px 22px;font:inherit;cursor:pointer}#app-startup [hidden]{display:none}
</style></head><body><div id="app"><main id="app-startup" role="status" aria-live="polite"><h1>猫猫小窝</h1><p id="app-startup-message">正在打开小窝…</p><button id="app-startup-retry" type="button" hidden>重新加载</button><noscript>请启用 JavaScript，再打开小窝。</noscript></main></div>
<script>
  (()=>{
    // This tiny fallback renders before external CSS/modules arrive. Never touch
    // save storage or auto-reload: retry must preserve pending local operations.
    const showRetry=()=>{
      const message=document.getElementById('app-startup-message');
      if(!message)return;
      message.textContent='加载较慢或资源暂时未能下载，请稍后重试。';
      document.getElementById('app-startup-retry').hidden=false;
    };
    document.getElementById('app-startup-retry').addEventListener('click',()=>location.reload());
    window.setTimeout(showRetry,12000);
    window.addEventListener('error',event=>{
      if(event.target?.id==='app-entry'||event.target?.tagName==='LINK'||event.error)showRetry();
    },true);
    window.addEventListener('unhandledrejection',showRetry);
  })();
</script><script id="app-entry" type="module" src="/src/entry.js"></script></body></html>
